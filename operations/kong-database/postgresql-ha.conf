# Requires a controlled PostgreSQL restart. Values are conservative starting
# points and must be paired with an approved off-host archive and replica.
password_encryption = 'scram-sha-256'
ssl = on
ssl_cert_file = '/run/secrets/kong_db_server_cert'
ssl_key_file = '/run/secrets/kong_db_server_key'
ssl_ca_file = '/run/secrets/kong_db_replication_ca'
wal_level = 'replica'
archive_mode = 'on'
archive_command = '/usr/local/sbin/codestra-kong-wal-archive.sh %p %f'
archive_timeout = '300s'
max_wal_senders = 5
max_replication_slots = 5
wal_keep_size = '1GB'
hot_standby = on
