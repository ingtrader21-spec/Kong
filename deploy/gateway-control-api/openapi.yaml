openapi: 3.1.0
info:
  title: Codestra Gateway Control API
  version: 1.0.0
  description: Private control-plane source contract. Approval and deployment are
    separate permissions. Runtime execution is disabled by default. Tenant/team authority
    is application-owned. The API never accepts raw Kong Admin payloads or live Admin
    credentials.
servers:
- url: https://gateway-control.internal.codestra
paths:
  /v1/integrations:
    post:
      operationId: post-v1-integrations
      security:
      - keycloak:
        - gateway.write
      responses:
        '200':
          description: Source/control result; no runtime mutation is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient tenant, role or scope authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource unavailable to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, approval state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or runtime execution unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
          pattern: ^[A-Za-z0-9._:-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCreate'
    get:
      operationId: get-v1-integrations
      security:
      - keycloak:
        - gateway.read
      responses:
        '200':
          description: Source/control result; no runtime mutation is implied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient tenant, role or scope authority
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Resource unavailable to caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Version, approval state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency or runtime execution unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 256
