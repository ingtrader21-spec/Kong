name: Temporary deterministic manifest repair

on:
  push:
    branches:
      - fix/staging-certification-test-deps-20260909

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'appolon1908-hue/Kong'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Regenerate manifests and remove temporary workflow
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = 'fix/staging-certification-test-deps-20260909'
          rm .github/workflows/temp-manifest-repair.yml
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/temp-manifest-repair.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git diff --cached --exit-code >/dev/null && { echo 'expected manifest repair changes are missing' >&2; exit 1; } || true
          git commit -m 'chore: refresh deterministic migration manifests'
          git push origin HEAD:refs/heads/fix/staging-certification-test-deps-20260909
