name: Repair Kong authority manifests once

on:
  push:
    branches:
      - fix/kong-staging-policy-pr-environment-20260903
    paths:
      - .github/workflows/repair-kong-manifests-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'appolon1908-hue/Kong' &&
      github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/kong-staging-policy-pr-environment-20260903
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact branch authority
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git branch --show-current)" = "fix/kong-staging-policy-pr-environment-20260903"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Remove one-shot workflow and regenerate final manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/repair-kong-manifests-once.yml
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git diff --check
      - name: Commit final manifest authority
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "codestra-kong-manifest-bot"
          git config user.email "codestra-kong-manifest-bot@users.noreply.github.com"
          git add -A .github/workflows/repair-kong-manifests-once.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git diff --cached --quiet && {
            echo "ERROR=no_manifest_repair" >&2
            exit 1
          }
          git commit -m "chore(manifest): bind staging-policy workflow authority"
          git push origin HEAD:fix/kong-staging-policy-pr-environment-20260903
