name: Reconcile PR 38 migration manifests

on:
  push:
    branches:
      - fix/middleware-runtime-authority-v1-20260830

permissions:
  contents: write

concurrency:
  group: pr38-manifest-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Remove one-time workflow and regenerate final-tree manifests
        run: |
          rm -- .github/workflows/pr38-manifest-reconcile.yml
          python tools/generate_migration_manifests.py
          python tools/verify_migration_manifest.py
      - name: Commit conflict-free manifest reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- .github/workflows/pr38-manifest-reconcile.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'chore: reconcile PR 38 manifests on current main'
          git push origin "HEAD:${GITHUB_REF_NAME}"
