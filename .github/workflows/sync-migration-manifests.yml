name: Sync migration manifests

on:
  push:
    branches-ignore:
      - main
    paths:
      - '.github/workflows/**'
      - 'config/**'
      - 'deploy/**'
      - 'docs/**'
      - 'operations/**'
      - 'scripts/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
      - 'README.md'
      - 'SECURITY.md'
      - 'pytest.ini'

permissions:
  contents: write

concurrency:
  group: kong-migration-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install generator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML

      - name: Regenerate deterministic migration manifests
        run: python3 tools/generate_migration_manifests.py

      - name: Commit generated artifacts only
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml && exit 0
          test -z "$(git status --porcelain --untracked-files=no | grep -vE '^( M|M |MM) MIGRATION_MANIFEST\.(json|yaml)$' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'chore: regenerate migration manifests'
          git push origin HEAD:${{ github.ref_name }}
