name: Finalize check-only Kong manifest authority

on:
  push:
    branches:
      - release/kong-29-route-immutable-candidate-20260903
    paths:
      - ".github/workflows/marketing-manifest-sync.yml"

permissions:
  contents: write

concurrency:
  group: kong-manifest-check-only-finalizer-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact release branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Prove triggering head
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Remove this one-time writer and generate final manifests
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          rm -- .github/workflows/marketing-manifest-sync.yml
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py
          test ! -e .github/workflows/marketing-manifest-sync.yml

      - name: Publish the final check-only source head
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .github/workflows/marketing-manifest-sync.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git diff --cached --check
          git commit -m "ci: finalize exact-head manifest validation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
