name: Finalize protected-check authority manifests

on:
  push:
    branches:
      - integration/platform-control-plane-v1-20260828

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/platform-control-plane-v1-20260828
          fetch-depth: 0
      - name: Install generator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Remove helper before computing canonical inventory
        run: rm .github/workflows/finalize-protected-check-manifests.yml
      - name: Regenerate immutable authority manifests
        run: python3 tools/generate_migration_manifests.py
      - name: Commit finalized manifest pair and helper deletion
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/finalize-protected-check-manifests.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'chore: attest bearer-preservation authority'
          git push origin HEAD:integration/platform-control-plane-v1-20260828
