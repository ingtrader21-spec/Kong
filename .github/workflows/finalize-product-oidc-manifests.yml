name: Finalize product OIDC authority manifests

on:
  push:
    branches:
      - integration/product-backend-oidc-routes-v1-20260829

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/product-backend-oidc-routes-v1-20260829
          fetch-depth: 0
          persist-credentials: true
      - name: Install generator dependency
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Remove helper before computing canonical inventory
        run: rm .github/workflows/finalize-product-oidc-manifests.yml
      - name: Regenerate immutable authority manifests
        run: |
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
      - name: Commit finalized manifest pair and helper deletion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/finalize-product-oidc-manifests.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git diff --cached --check
          git commit -m 'chore: attest product OIDC authority inventory'
          git push origin HEAD:integration/product-backend-oidc-routes-v1-20260829
