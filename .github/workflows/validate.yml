name: Validate Kong source authority

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck lua5.4
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          DECK_VERSION=1.55.0
          DECK_SHA256=22958ee3a34fc91a41fb215c0f8f81c08e29d363bd5c41dc8287ce9bcd89bc11
          curl --fail --location --silent --show-error \
            --output /tmp/deck.tar.gz \
            "https://github.com/Kong/deck/releases/download/v${DECK_VERSION}/deck_${DECK_VERSION}_linux_amd64.tar.gz"
          echo "${DECK_SHA256}  /tmp/deck.tar.gz" | sha256sum --check
          tar -xzf /tmp/deck.tar.gz -C /tmp deck
      - name: Validate structured source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          for path in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
          PY
          python3 -m compileall -q deploy operations scripts tests tools
          python3 scripts/validate_community_n8n_egress.py
          luac -p deploy/kong/scope-policy.lua
          /tmp/deck file validate deploy/kong/control-plane.yml
      - name: Validate shell and source policies
        run: |
          find operations deploy scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find operations deploy scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -x
          ! grep -RIlE --exclude-dir=tests --exclude-dir=reports --exclude-dir=docs \
            --exclude='MIGRATION_MANIFEST.json' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|client_secret[[:space:]]*=[[:space:]]*[^[:space:]]+)' \
            .
      - name: Run Kong authority tests
        run: |
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_n8n_control_plane.py \
            tests/test_kong_n8n_editor_route.py \
            tests/test_oidc_auth.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py
          pytest -q tests/test_community_n8n_egress.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git diff --exit-code
          test -z "$(git status --porcelain)"

  kong-config:
    name: kong-config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install config validators
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          DECK_VERSION=1.55.0
          DECK_SHA256=22958ee3a34fc91a41fb215c0f8f81c08e29d363bd5c41dc8287ce9bcd89bc11
          curl --fail --location --silent --show-error \
            --output /tmp/deck.tar.gz \
            "https://github.com/Kong/deck/releases/download/v${DECK_VERSION}/deck_${DECK_VERSION}_linux_amd64.tar.gz"
          echo "${DECK_SHA256}  /tmp/deck.tar.gz" | sha256sum --check
          tar -xzf /tmp/deck.tar.gz -C /tmp deck
      - name: Validate canonical Kong configuration
        run: |
          set -Eeuo pipefail
          /tmp/deck file validate deploy/kong/control-plane.yml
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('config').rglob('*.json'):
              json.loads(path.read_text())
          for path in list(Path('deploy').rglob('*.yml')) + list(Path('deploy').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
          PY
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install security test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest PyYAML
      - name: Enforce fail-closed security policy
        run: |
          set -Eeuo pipefail
          ! grep -RIlE --exclude-dir=.git --exclude-dir=tests --exclude-dir=reports --exclude-dir=docs \
            --exclude='MIGRATION_MANIFEST.json' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|client_secret[[:space:]]*=[[:space:]]*[^[:space:]]+)' \
            .
          pytest -q \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_change_authority.py \
            tests/test_kong_database_operations.py
          python3 tools/verify_migration_manifest.py
