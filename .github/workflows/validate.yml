name: Validate Kong source authority

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed commit without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck lua5.4
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          DECK_VERSION=1.55.0
          DECK_SHA256=22958ee3a34fc91a41fb215c0f8f81c08e29d363bd5c41dc8287ce9bcd89bc11
          curl --fail --location --silent --show-error \
            --output /tmp/deck.tar.gz \
            "https://github.com/Kong/deck/releases/download/v${DECK_VERSION}/deck_${DECK_VERSION}_linux_amd64.tar.gz"
          echo "${DECK_SHA256}  /tmp/deck.tar.gz" | sha256sum --check
          tar -xzf /tmp/deck.tar.gz -C /tmp deck
      - name: Validate structured source
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          for path in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
          PY
          python3 -m compileall -q deploy operations scripts tests tools
          luac -p deploy/kong/scope-policy.lua
          /tmp/deck file validate deploy/kong/control-plane.yml
      - name: Validate shell and source policies
        run: |
          find operations deploy scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r -n1 bash -n
          find operations deploy scripts -type f -name '*.sh' -print0 \
            | xargs -0 -r shellcheck -x
          ! grep -RIlE --exclude-dir=tests --exclude-dir=reports --exclude-dir=docs \
            --exclude='MIGRATION_MANIFEST.json' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|client_secret[[:space:]]*=[[:space:]]*[^[:space:]]+)' \
            .
      - name: Run Kong authority tests
        run: |
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py \
            tests/test_kong_observability.py
      - name: Generate migration manifest candidate
        run: python3 tools/generate_migration_manifests.py
      - name: Upload migration manifest candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kong-migration-manifest-candidate
          path: |
            MIGRATION_MANIFEST.json
            MIGRATION_MANIFEST.yaml
          if-no-files-found: error
          retention-days: 1
      - name: Commit exact generated manifest pair on same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml; then
            echo "Migration manifests are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m "chore(authority): refresh Kong migration manifests"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${HEAD_REF}"
      - name: Verify committed migration authority
        run: |
          python3 tools/verify_migration_manifest.py
          git diff --exit-code
          test -z "$(git status --porcelain)"
