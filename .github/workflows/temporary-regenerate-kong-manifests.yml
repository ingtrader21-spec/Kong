name: One-shot regenerate Kong manifests

on:
  push:
    branches:
      - fix/kong-staging-n8n-issuer-20260904
    paths:
      - ".github/workflows/temporary-regenerate-kong-manifests.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-kong-manifest-regeneration
  cancel-in-progress: false

jobs:
  regenerate-and-remove-self:
    if: >-
      github.repository == 'appolon1908-hue/Kong' &&
      github.ref == 'refs/heads/fix/kong-staging-n8n-issuer-20260904' &&
      github.actor == 'appolon1908-hue'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head with bounded write authority
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Regenerate final manifests and remove this one-shot workflow
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/fix/kong-staging-n8n-issuer-20260904
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rm -- .github/workflows/temporary-regenerate-kong-manifests.yml
          python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git diff --check
          mapfile -t changed < <(git status --short | awk '{print $2}' | sort)
          expected=(
            .github/workflows/temporary-regenerate-kong-manifests.yml
            MIGRATION_MANIFEST.json
            MIGRATION_MANIFEST.yaml
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${changed[$index]}" = "${expected[$index]}"
          done

      - name: Commit only the deterministic manifests and self-deletion
        env:
          TARGET_BRANCH: fix/kong-staging-n8n-issuer-20260904
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml .github/workflows/temporary-regenerate-kong-manifests.yml
          git diff --cached --check
          git commit -m 'chore(manifest): regenerate deterministic Kong inventory'
          git push origin "HEAD:${TARGET_BRANCH}"
