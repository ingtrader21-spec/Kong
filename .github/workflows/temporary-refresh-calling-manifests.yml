name: temporary-refresh-calling-manifests

on:
  push:
    branches:
      - chore/calling-contract-pin-issue-257
    paths:
      - .github/workflows/temporary-refresh-calling-manifests.yml

permissions:
  contents: write

concurrency:
  group: temporary-refresh-calling-manifests
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chore/calling-contract-pin-issue-257
          fetch-depth: 0
          persist-credentials: true

      - name: Validate the final calling source before manifest generation
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          python3 scripts/validate_kong_calling_policy.py
          python3 scripts/validate_kong_calling_policy.py --self-test
          luac -p deploy/kong/calling-policy.lua
          pytest -q tests/test_kong_calling_policy.py

      - name: Remove one-shot workflow and regenerate exact authority manifests
        run: |
          set -Eeuo pipefail
          rm .github/workflows/temporary-refresh-calling-manifests.yml
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py
          git diff --check

      - name: Commit the self-cleaning manifest refresh
        run: |
          set -Eeuo pipefail
          git config user.name "codestra-kong-certifier"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- \
            .github/workflows/temporary-refresh-calling-manifests.yml \
            MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m "chore(calling): refresh canonical Kong manifests"
          git push origin HEAD:chore/calling-contract-pin-issue-257
