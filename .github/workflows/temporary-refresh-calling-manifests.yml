name: temporary-refresh-calling-manifests

on:
  push:
    branches:
      - chore/calling-contract-pin-issue-257
    paths:
      - .github/workflows/temporary-refresh-calling-manifests.yml

permissions:
  contents: write

concurrency:
  group: temporary-refresh-calling-manifests
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chore/calling-contract-pin-issue-257
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Regenerate final manifests without temporary workflow authority
        shell: bash
        run: |
          set -Eeuo pipefail
          helper=.github/workflows/temporary-refresh-calling-manifests.yml
          cp "$helper" /tmp/temporary-refresh-calling-manifests.yml
          rm "$helper"
          python -m pip install --disable-pip-version-check --no-input PyYAML
          python tools/generate_migration_manifests.py
          cp /tmp/temporary-refresh-calling-manifests.yml "$helper"
          python tools/verify_migration_manifest.py
          git diff --check
          git config user.name "codestra-manifest-refresh"
          git config user.email "actions@users.noreply.github.com"
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m "chore(calling): refresh final digest manifests"
          git push origin HEAD:chore/calling-contract-pin-issue-257
