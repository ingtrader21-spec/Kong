name: Finalize PR 7 cell-platform source

on:
  push:
    branches:
      - architecture/kong-cell-platform-v1
    paths:
      - .github/workflows/pr7-finalize-cell-platform.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Install pinned validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck lua5.4
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          DECK_VERSION=1.55.0
          DECK_SHA256=22958ee3a34fc91a41fb215c0f8f81c08e29d363bd5c41dc8287ce9bcd89bc11
          curl --fail --location --silent --show-error \
            --output /tmp/deck.tar.gz \
            "https://github.com/Kong/deck/releases/download/v${DECK_VERSION}/deck_${DECK_VERSION}_linux_amd64.tar.gz"
          echo "${DECK_SHA256}  /tmp/deck.tar.gz" | sha256sum --check
          tar -xzf /tmp/deck.tar.gz -C /tmp deck

      - name: Remove one-shot workflow and regenerate exact manifests
        run: |
          rm .github/workflows/pr7-finalize-cell-platform.yml
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py

      - name: Validate the complete combined source tree
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text())
          for path in list(Path('.').rglob('*.yml')) + list(Path('.').rglob('*.yaml')):
              yaml.safe_load(path.read_text())
          PY
          python3 -m compileall -q deploy operations scripts tests tools
          luac -p deploy/kong/scope-policy.lua
          /tmp/deck file validate deploy/kong/control-plane.yml
          find operations deploy scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          find operations deploy scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck -x
          python3 scripts/validate_codestra_cells.py
          pytest -q
          ! grep -RIlE --exclude-dir=tests --exclude-dir=reports --exclude-dir=docs \
            --exclude='MIGRATION_MANIFEST.json' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|Authorization:[[:space:]]*Bearer[[:space:]]+[^[:space:]]+|client_secret[[:space:]]*=[[:space:]]*[^[:space:]]+)' \
            .
          test "$(git ls-files --stage scripts/reconcile_kong_canonical_routes.py | awk '{print $1}')" = "100755"
          test "$(git ls-files --stage scripts/validate_codestra_cells.py | awk '{print $1}')" = "100755"
          git diff --check

      - name: Commit and push the exact tested source tree
        run: |
          test ! -e .github/workflows/pr7-finalize-cell-platform.yml
          git config user.name "codestra-cell-platform[bot]"
          git config user.email "appolon1908-hue@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(architecture): publish exact cell-platform manifest pair"
          git push origin "HEAD:architecture/kong-cell-platform-v1"
