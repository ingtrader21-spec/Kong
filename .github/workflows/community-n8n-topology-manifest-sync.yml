name: Reconcile community n8n topology gate manifests

on:
  push:
    branches:
      - security/community-n8n-topology-gate-v1-20260830

permissions:
  contents: write

concurrency:
  group: community-n8n-topology-manifest-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML
      - name: Validate topology source before manifest mutation
        run: |
          python -m compileall -q operations scripts tests
          python scripts/validate_community_n8n_egress.py
          pytest -q tests/test_community_n8n_egress.py
      - name: Remove one-time workflow and regenerate final-tree manifests
        run: |
          rm -- .github/workflows/community-n8n-topology-manifest-sync.yml
          python tools/generate_migration_manifests.py
          python tools/verify_migration_manifest.py
      - name: Commit deterministic final-tree manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/community-n8n-topology-manifest-sync.yml \
            MIGRATION_MANIFEST.json \
            MIGRATION_MANIFEST.yaml
          git commit -m 'chore: regenerate exact-source topology manifests'
          git push origin "HEAD:${GITHUB_REF_NAME}"
