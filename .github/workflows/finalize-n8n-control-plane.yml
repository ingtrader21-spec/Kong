name: one-shot finalize n8n control plane

on:
  push:
    branches:
      - integration/platform-control-plane-v1-20260828

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/platform-control-plane-v1-20260828
          fetch-depth: 1
      - name: Patch dispatcher, test, refresh manifests, and remove one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/reconcile_kong_canonical_routes.py')
          lines = path.read_text().splitlines()

          authority_inserted = False
          for index, line in enumerate(lines):
              if line.strip() != 'else:' or index == 0:
                  continue
              if 'authority.methods' not in lines[index - 1] or '["POST"]' not in lines[index - 1]:
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              body = indent + '    '
              block = [
                  indent + 'elif path.name == "kong-n8n-control-plane-routes.json":',
                  body + 'route = one(',
                  body + '    [item for item in manifest["routes"] if item["name"] == route_name],',
                  body + '    f"security authority route {route_name}",',
                  body + ')',
                  body + 'require_equal([route["path"]], expected["paths"], f"{route_name}.authority.paths")',
                  body + 'require_equal([route["method"]], expected["methods"], f"{route_name}.authority.methods")',
              ]
              lines[index:index] = block
              authority_inserted = True
              break
          if not authority_inserted:
              raise SystemExit('security_authority insertion point not found')

          verify_inserted = False
          for index, line in enumerate(lines):
              if line.strip() != 'if authority_path.name != "kong-campaign-automation-routes.json":':
                  continue
              indent = line[: len(line) - len(line.lstrip())]
              body = indent + '    '
              block = [
                  indent + 'if authority_path.name == "kong-n8n-control-plane-routes.json":',
                  body + 'n8n = security_module(root, "reconcile_kong_n8n_control_plane")',
                  body + 'n8n.verify_plugins(plugins, authority_route, manifest)',
                  body + 'return',
              ]
              lines[index:index] = block
              verify_inserted = True
              break
          if not verify_inserted:
              raise SystemExit('verify_security_plugins insertion point not found')

          path.write_text('\n'.join(lines) + '\n')
          PY
          rm .github/workflows/finalize-n8n-control-plane.yml
          python3 -m compileall -q scripts tests tools
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_n8n_control_plane.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finalize exact N8N gateway authority'
          git push origin HEAD:integration/platform-control-plane-v1-20260828
