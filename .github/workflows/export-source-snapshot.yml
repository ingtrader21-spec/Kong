name: Export Kong source snapshot

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Create exact source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=kong-source-snapshot.tar \
            -cf kong-source-snapshot.tar .
          sha256sum kong-source-snapshot.tar > kong-source-snapshot.tar.sha256

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kong-source-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            kong-source-snapshot.tar
            kong-source-snapshot.tar.sha256
          if-no-files-found: error
          retention-days: 1
