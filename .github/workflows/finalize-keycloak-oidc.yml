name: one-shot finalize Keycloak OIDC route authority

on:
  push:
    branches:
      - integration/keycloak-oidc-n8n-v1-20260829

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/keycloak-oidc-n8n-v1-20260829
          fetch-depth: 1
      - name: Patch exact authority, validate, refresh manifests, and self-delete
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/reconcile_kong_n8n_control_plane.py')
          source = path.read_text()
          anchor = '''    return {
                  "jwt": {
          '''
          replacement = '''    return {
                  "openid-connect": {
                      "issuer": spec["oidc_discovery"],
                      "auth_methods": ["bearer"],
                      "audience": [spec["audience"]],
                      "consumer_claim": ["azp"],
                  },
                  "jwt": {
          '''
          if source.count(anchor) != 1:
              raise SystemExit(f'expected_plugin_configs anchor count={source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)

          anchor = '''    spec = json.loads(args.manifest.read_text())
          '''
          replacement = '''    spec = json.loads(args.manifest.read_text())
              expected_discovery = spec.get("issuer", "") + "/.well-known/openid-configuration"
              expected_jwks = spec.get("issuer", "") + "/protocol/openid-connect/certs"
              if spec.get("oidc_discovery") != expected_discovery:
                  raise RuntimeError("N8N OIDC discovery must match canonical Keycloak issuer")
              if spec.get("jwks_uri") != expected_jwks:
                  raise RuntimeError("N8N JWKS URI must match canonical Keycloak issuer")
              if args.jwks_url.rstrip("/") != expected_jwks.rstrip("/"):
                  raise RuntimeError("runtime JWKS URL differs from reviewed N8N authority")
          '''
          if source.count(anchor) != 1:
              raise SystemExit(f'main spec anchor count={source.count(anchor)}')
          source = source.replace(anchor, replacement, 1)
          path.write_text(source)

          test_path = Path('tests/test_kong_n8n_control_plane.py')
          test_source = test_path.read_text()
          addition = '''\n\ndef test_n8n_reconciler_requires_keycloak_openid_connect():\n    module = _load(RECONCILER_PATH, "reconcile_kong_n8n_control_plane_oidc")\n    spec = json.loads(SPEC_PATH.read_text())\n    route = spec["routes"][0]\n    expected = module.expected_plugin_configs(spec, route)\n    assert expected["openid-connect"] == {\n        "issuer": spec["oidc_discovery"],\n        "auth_methods": ["bearer"],\n        "audience": ["middleware-api"],\n        "consumer_claim": ["azp"],\n    }\n    assert "jwt" in expected  # retained as second validation layer until staging certification\n'''
          if 'def test_n8n_reconciler_requires_keycloak_openid_connect' not in test_source:
              test_path.write_text(test_source + addition)

          workflow = Path('.github/workflows/validate.yml')
          workflow_source = workflow.read_text()
          needle = '            tests/test_kong_n8n_control_plane.py \\\n'
          if needle not in workflow_source:
              raise SystemExit('validate workflow N8N test anchor not found')
          if 'tests/test_oidc_auth.py' not in workflow_source:
              workflow_source = workflow_source.replace(
                  needle,
                  needle + '            tests/test_oidc_auth.py \\\n',
                  1,
              )
          workflow.write_text(workflow_source)
          PY
          rm .github/workflows/finalize-keycloak-oidc.yml
          python3 -m compileall -q scripts tests tools
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_n8n_control_plane.py \
            tests/test_oidc_auth.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: bind N8N gateway authority to Keycloak OIDC'
          git push origin HEAD:integration/keycloak-oidc-n8n-v1-20260829
