name: Generate production release evidence

on:
  pull_request:
    branches: [production]
  push:
    branches: [production]

permissions:
  contents: read

jobs:
  release-evidence:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Generate immutable release evidence
        env:
          KONG_IMAGE_DIGEST: ${{ vars.KONG_IMAGE_DIGEST }}
          STAGING_CERTIFICATION: ${{ vars.STAGING_CERTIFICATION }}
          ROLLBACK_SOURCE_SHA: ${{ vars.ROLLBACK_SOURCE_SHA }}
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 tools/generate_release_manifest.py \
            --output release-manifest.json \
            --kong-image-digest "${KONG_IMAGE_DIGEST:-UNRESOLVED}" \
            --staging-certification "${STAGING_CERTIFICATION:-UNRESOLVED}" \
            --rollback-source-sha "${ROLLBACK_SOURCE_SHA:-UNRESOLVED}"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: kong-release-${{ github.sha }}
          path: release-manifest.json
