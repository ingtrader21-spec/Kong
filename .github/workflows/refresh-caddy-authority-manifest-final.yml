name: one-shot finalize Caddy authority manifest inventory

on:
  push:
    branches: [docs/caddy-edge-authority-20260829]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/caddy-edge-authority-20260829
          fetch-depth: 1
      - name: Remove helper, regenerate final inventory, validate and push
        run: |
          set -Eeuo pipefail
          rm .github/workflows/refresh-caddy-authority-manifest-final.yml
          python3 -m pip install --disable-pip-version-check pytest PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          pytest -q \
            tests/test_kong_canonical_route_contract.py \
            tests/test_kong_route_authority_hardening.py \
            tests/test_kong_database_operations.py \
            tests/test_kong_change_authority.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: finalize Kong Caddy authority inventory'
          git push origin HEAD:docs/caddy-edge-authority-20260829
