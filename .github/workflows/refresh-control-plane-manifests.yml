name: one-shot refresh control-plane manifests

on:
  push:
    branches:
      - integration/platform-control-plane-v1-20260828

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: integration/platform-control-plane-v1-20260828
          fetch-depth: 1
      - name: Generate final manifest pair and remove this one-shot workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML
          rm .github/workflows/refresh-control-plane-manifests.yml
          python3 tools/generate_migration_manifests.py
          python3 tools/generate_migration_manifests.py --check
          python3 tools/verify_migration_manifest.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: refresh migration authority manifests'
          git push origin HEAD:integration/platform-control-plane-v1-20260828
