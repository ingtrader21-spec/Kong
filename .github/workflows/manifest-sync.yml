name: Export exact regenerated Kong authority files

on:
  push:
    branches:
      - fix/kong-staging-certification-environment-20260903

permissions:
  contents: read

concurrency:
  group: kong-authority-manifest-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    name: export-regenerated-files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Restore final check-only workflow and regenerate exact manifests
        env:
          FINAL_WORKFLOW_BASE64: 
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = fix/kong-staging-certification-environment-20260903
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s' "$FINAL_WORKFLOW_BASE64" | base64 --decode > .github/workflows/manifest-sync.yml
          test "$(wc -c < .github/workflows/manifest-sync.yml)" -eq 1936
          test "$(sha256sum .github/workflows/manifest-sync.yml | awk '{print $1}')" = 342851089c9e14a4a48f709c1e40dffee97f003efd473ab9cbc7733c1bb62353

          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py

          printf '%s\n' \
            .github/workflows/manifest-sync.yml \
            MIGRATION_MANIFEST.json \
            MIGRATION_MANIFEST.yaml > "$RUNNER_TEMP/expected-files"
          git diff --name-only | sort > "$RUNNER_TEMP/changed-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"

      - name: Upload exact final files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kong-staging-admission-final-files-${{ github.sha }}
          path: |
            .github/workflows/manifest-sync.yml
            MIGRATION_MANIFEST.json
            MIGRATION_MANIFEST.yaml
          if-no-files-found: error
          retention-days: 1

      - name: Record source-only export boundary
        run: |
          echo 'KONG_MANIFEST_EXPORT=PASS'
          echo 'RUNTIME_MUTATION_AUTHORIZED=NO'
          echo 'ADMIN_API_CALLS_AUTHORIZED=NO'
          echo 'PRODUCTION_TRAFFIC_AUTHORIZED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
