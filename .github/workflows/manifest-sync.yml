name: Regenerate Kong authority manifests once

on:
  push:
    branches:
      - fix/kong-staging-certification-environment-20260903

permissions:
  contents: write

concurrency:
  group: kong-authority-manifest-regeneration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: regenerate-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Regenerate and commit only authority manifests
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = fix/kong-staging-certification-environment-20260903
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py

          if git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml; then
            echo 'KONG_MANIFEST_REFRESH=ALREADY_CURRENT'
            exit 0
          fi

          git diff --name-only | sort > "$RUNNER_TEMP/changed-files"
          printf '%s\n' MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml > "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'ci: refresh Kong authority manifests for staging admission'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record source-only boundary
        run: |
          echo 'RUNTIME_MUTATION_AUTHORIZED=NO'
          echo 'ADMIN_API_CALLS_AUTHORIZED=NO'
          echo 'PRODUCTION_TRAFFIC_AUTHORIZED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
