name: Regenerate Kong authority manifests

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - "release/**"
    paths-ignore:
      - "MIGRATION_MANIFEST.json"
      - "MIGRATION_MANIFEST.yaml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kong-authority-manifest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manifest-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Restrict mutation to non-protected development branches
        run: |
          set -Eeuo pipefail
          case "${GITHUB_REF_NAME}" in
            feature/*|fix/*|release/*) ;;
            *) echo "manifest sync refuses protected branch ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac
      - name: Check out exact branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Generate and verify exact manifest pair
        run: |
          set -Eeuo pipefail
          python3 -m pip install --disable-pip-version-check PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py
      - name: Commit generated authority only when changed
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml; then
            echo "KONG_AUTHORITY_MANIFESTS=CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m "chore(authority): refresh Kong migration manifests"
          git push origin "HEAD:${GITHUB_REF_NAME}"
