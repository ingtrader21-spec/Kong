name: Bind Kong manifests to final check-only workflow

on:
  push:
    branches:
      - fix/kong-staging-certification-environment-20260903

permissions:
  contents: write

concurrency:
  group: kong-final-manifest-binding-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bind:
    name: bind-final-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Bind both manifests to the final workflow bytes
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = fix/kong-staging-certification-environment-20260903
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 - <<'PY'
          from pathlib import Path
          import json
          import yaml

          workflow_sha = "342851089c9e14a4a48f709c1e40dffee97f003efd473ab9cbc7733c1bb62353"
          workflow_size = 1936
          generation_id = "4eb0e8191cf7567feb7987a17451d8055ab0a57f7ef5916305d28c09f46f5301"

          json_path = Path("MIGRATION_MANIFEST.json")
          value = json.loads(json_path.read_text(encoding="utf-8"))
          entry = next(item for item in value["files"] if item["path"] == ".github/workflows/manifest-sync.yml")
          entry["sha256"] = workflow_sha
          entry["size"] = workflow_size
          value["manifest_generation_id"] = generation_id
          json_path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          yaml_path = Path("MIGRATION_MANIFEST.yaml")
          yvalue = yaml.safe_load(yaml_path.read_text(encoding="utf-8"))
          yentry = next(item for item in yvalue["files"] if item["path"] == ".github/workflows/manifest-sync.yml")
          yentry["sha256"] = workflow_sha
          yentry["size"] = workflow_size
          yvalue["manifest_generation_id"] = generation_id
          yaml_path.write_text(yaml.safe_dump(yvalue, sort_keys=True), encoding="utf-8")
          PY

          test "$(sha256sum MIGRATION_MANIFEST.json | awk '{print $1}')" = fefbe25dc11e36b8e36f81f28d8a6416036e6f27e2073021fe47ac37cb40a8ba
          test "$(sha256sum MIGRATION_MANIFEST.yaml | awk '{print $1}')" = 62d3c15a39fe2a2f0ff12fc1ad61e8199e8e7c0105390ecc43727b33206c2e4c

          if git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml; then
            echo 'KONG_FINAL_MANIFEST_BINDING=ALREADY_CURRENT'
            exit 0
          fi

          git diff --name-only | sort > "$RUNNER_TEMP/changed-files"
          printf '%s\n' MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml > "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'ci: bind manifests to final Kong staging admission workflow'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record source-only boundary
        run: |
          echo 'RUNTIME_MUTATION_AUTHORIZED=NO'
          echo 'ADMIN_API_CALLS_AUTHORIZED=NO'
          echo 'PRODUCTION_TRAFFIC_AUTHORIZED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
