name: Refresh Kong authority manifests on current main once

on:
  push:
    branches:
      - fix/kong-staging-certification-current-main-20260903

permissions:
  contents: write

concurrency:
  group: kong-current-main-manifest-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh-current-main-manifests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      FINAL_WORKFLOW_BASE64: 
    steps:
      - name: Check out exact one-shot source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Restore check-only workflow and regenerate exact manifests
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF_NAME" = fix/kong-staging-certification-current-main-20260903
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s' "$FINAL_WORKFLOW_BASE64" | base64 --decode > .github/workflows/manifest-sync.yml
          test "$(wc -c < .github/workflows/manifest-sync.yml)" -eq 1936
          test "$(sha256sum .github/workflows/manifest-sync.yml | awk '{print $1}')" = 342851089c9e14a4a48f709c1e40dffee97f003efd473ab9cbc7733c1bb62353

          python3 -m pip install --disable-pip-version-check --no-input PyYAML
          python3 tools/generate_migration_manifests.py
          python3 tools/verify_migration_manifest.py

          git diff --name-only | sort > "$RUNNER_TEMP/changed-files"
          printf '%s\n' \
            .github/workflows/manifest-sync.yml \
            MIGRATION_MANIFEST.json \
            MIGRATION_MANIFEST.yaml | sort > "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/changed-files"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/manifest-sync.yml MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'ci: refresh Kong authority manifests on current main'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Record no-runtime boundary
        run: |
          echo 'KONG_MANIFEST_REFRESH=PASS'
          echo 'RUNTIME_MUTATION_AUTHORIZED=NO'
          echo 'ADMIN_API_CALLS_AUTHORIZED=NO'
          echo 'PRODUCTION_TRAFFIC_AUTHORIZED=NO'
          echo 'EXTERNAL_EFFECTS_ENABLED=NO'
