name: Marketing Stage 5 Certification

on:
  pull_request:
    paths:
      - 'config/marketing-stage4-routes.yaml'
      - 'scripts/validate_marketing_routes.py'
      - '.github/workflows/marketing-stage5-certification.yml'
      - 'MIGRATION_MANIFEST.json'
      - 'MIGRATION_MANIFEST.yaml'

permissions:
  contents: write

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python scripts/validate_marketing_routes.py
      - name: Generate and verify governed manifests
        run: |
          python tools/generate_migration_manifests.py
          python tools/verify_migration_manifest.py
      - name: Commit governed manifest synchronization
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml; then
            echo 'KONG_MANIFEST_SYNC=NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          git commit -m 'chore: synchronize Kong migration manifests'
          git push origin "HEAD:${HEAD_BRANCH}"
