name: Marketing Stage 5 Certification

on:
  pull_request:
    paths:
      - 'config/marketing-stage4-routes.yaml'
      - 'scripts/validate_marketing_routes.py'
      - '.github/workflows/marketing-stage5-certification.yml'
      - 'MIGRATION_MANIFEST.json'
      - 'MIGRATION_MANIFEST.yaml'

permissions:
  contents: read

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python scripts/validate_marketing_routes.py
      - name: Verify governed manifests are synchronized
        run: |
          python tools/generate_migration_manifests.py
          git diff --exit-code -- MIGRATION_MANIFEST.json MIGRATION_MANIFEST.yaml
          python tools/verify_migration_manifest.py
